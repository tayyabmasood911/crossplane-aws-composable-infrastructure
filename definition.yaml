apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xnetworks.aws.tayyab.dev
spec:
  group: aws.tayyab.dev
  names:
    kind: XNetwork
    plural: xnetworks
  claimNames:
    kind: NetworkClaim
    plural: networkclaims
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - cidrBlock
                - region
              properties:
                cidrBlock:
                  type: string
                  description: "IPv4 CIDR block for the VPC"
                region:
                  type: string
                  description: "Target AWS region"
                enableDnsHostnames:
                  type: boolean
                  default: true
                subnets:
                  type: array
                  items:
                    type: object
                    required:
                      - cidrBlock
                      - availabilityZone
                    properties:
                      cidrBlock:
                        type: string
                      availabilityZone:
                        type: string
            status:
              type: object
              properties:
                vpcId:
                  type: string
                state:
                  type: string
